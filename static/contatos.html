<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contatos · EPCVIEW</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  .filtros { display: inline-flex; padding: 3px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .filtro {
    border: none; background: none; cursor: pointer;
    height: 32px; padding: 0 14px; border-radius: var(--radius-xs);
    font: 600 13px var(--font); color: var(--text-muted);
  }
  .filtro.ativo { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
  .filtro b { margin-left: 4px; color: var(--primary); }

  .lista { display: flex; flex-direction: column; gap: 10px; max-width: 980px; }

  .contato {
    display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px;
    padding: 16px 18px;
  }
  .contato.nao-lido { border-left: 3px solid var(--primary); }
  .ct-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--primary-soft); color: var(--primary);
    font-size: 13px; font-weight: 700;
  }
  .contato.nao-lido .ct-avatar { background: var(--primary); color: #fff; }
  .ct-linha { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ct-nome { margin: 0; font-size: 15px; font-weight: 600; }
  .contato.nao-lido .ct-nome { font-weight: 700; }
  .ct-empresa { font-size: 13px; color: var(--text-muted); }
  .ct-assunto {
    font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 8px; border-radius: var(--radius-full);
    background: var(--surface-soft); border: 1px solid var(--border); color: var(--text-muted);
  }
  .ct-meios { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 4px; font-size: 13px; }
  .ct-meios a { color: var(--primary); text-decoration: none; }
  .ct-meios a:hover { text-decoration: underline; }
  .ct-meios span { color: var(--text-muted); }
  .ct-mensagem { margin: 10px 0 0; font-size: 14px; color: var(--text); line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .ct-mensagem.vazia { color: var(--text-light); font-style: italic; }
  .ct-lado { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .ct-data { font-size: 12px; color: var(--text-light); white-space: nowrap; }
  .ct-acoes { display: flex; gap: 4px; }
  .ct-acoes .btn { height: 32px; padding: 0 10px; font-size: 12px; }

  @media (max-width: 640px) {
    .contato { grid-template-columns: 1fr; }
    .ct-avatar { display: none; }
    .ct-lado { flex-direction: row; justify-content: space-between; align-items: center; }
  }
</style>
</head>

<body>
<div class="app">

  <aside id="barra-lateral"></aside>

  <main class="conteudo">
    <header class="topo">
      <div>
        <h1>Contatos</h1>
        <p id="contagem">Pedidos enviados pelo formulário do site.</p>
      </div>
      <div class="filtros" role="tablist" aria-label="Filtrar contatos">
        <button class="filtro ativo" data-filtro="todos" role="tab" aria-selected="true">Todos</button>
        <button class="filtro" data-filtro="nao-lidos" role="tab" aria-selected="false">Não lidos<b id="qtd-nao-lidos"></b></button>
      </div>
    </header>

    <div class="corpo">
      <div id="lista" class="lista"></div>
    </div>
  </main>
</div>

<script src="assets/ui.js"></script>
<script>
(function () {
  'use strict';

  const lista = document.getElementById('lista');
  const ASSUNTOS = { demonstracao: 'Demonstração', proposta: 'Proposta', parceria: 'Parceria', outro: 'Outro' };
  let contatos = [];
  let filtro = 'todos';

  function iniciais(nome) {
    const partes = String(nome || '?').trim().split(/\s+/);
    return ((partes[0] || '')[0] + ((partes.length > 1 ? partes[partes.length - 1] : '')[0] || '')).toUpperCase();
  }

  function dataCompleta(iso) {
    return new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  }

  function el(tag, classe, texto) {
    const e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texto != null) e.textContent = texto;     // tudo aqui veio de um formulário público
    return e;
  }

  function cartao(c) {
    const art = el('article', 'cartao contato surgir' + (c.lido ? '' : ' nao-lido'));

    art.appendChild(el('div', 'ct-avatar', iniciais(c.nome)));

    const meio = el('div');
    const linha = el('div', 'ct-linha');
    linha.appendChild(el('h3', 'ct-nome', c.nome));
    if (c.empresa) linha.appendChild(el('span', 'ct-empresa', c.empresa));
    linha.appendChild(el('span', 'ct-assunto', ASSUNTOS[c.interesse] || 'Contato'));
    meio.appendChild(linha);

    const meios = el('div', 'ct-meios');
    const email = el('a', null, c.email);
    email.href = 'mailto:' + encodeURIComponent(c.email).replace(/%40/g, '@') +
      '?subject=' + encodeURIComponent('EPCVIEW — seu contato');
    meios.appendChild(email);
    if (c.telefone) meios.appendChild(el('span', null, c.telefone));
    meio.appendChild(meios);

    meio.appendChild(el('p', 'ct-mensagem' + (c.mensagem ? '' : ' vazia'), c.mensagem || 'Sem mensagem.'));
    art.appendChild(meio);

    const lado = el('div', 'ct-lado');
    const data = el('span', 'ct-data', UHNUI.dataRelativa(c.criadoEm));
    data.title = dataCompleta(c.criadoEm);
    lado.appendChild(data);

    const acoes = el('div', 'ct-acoes');
    const alternar = el('button', 'btn btn-contorno', c.lido ? 'Marcar não lido' : 'Marcar lido');
    alternar.addEventListener('click', () => marcar(c, !c.lido));
    const excluir = el('button', 'btn btn-perigo');
    excluir.title = 'Excluir contato';
    excluir.setAttribute('aria-label', 'Excluir contato de ' + c.nome);
    excluir.innerHTML = UHNUI.icone('<path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>', 14);
    excluir.addEventListener('click', () => remover(c));
    acoes.append(alternar, excluir);
    lado.appendChild(acoes);
    art.appendChild(lado);

    return art;
  }

  function vazio(titulo, texto) {
    const div = el('div', 'vazio');
    div.innerHTML = '<div class="vazio-icone">' +
      UHNUI.icone('<path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/><path d="m3 7 9 6 9-6"/>', 24) + '</div>';
    div.append(el('h3', null, titulo), el('p', null, texto));
    return div;
  }

  function renderizar() {
    const naoLidos = contatos.filter(c => !c.lido).length;
    document.getElementById('qtd-nao-lidos').textContent = naoLidos ? String(naoLidos) : '';
    document.getElementById('contagem').textContent = !contatos.length
      ? 'Pedidos enviados pelo formulário do site.'
      : contatos.length + (contatos.length === 1 ? ' contato' : ' contatos') +
        (naoLidos ? ' · ' + naoLidos + (naoLidos === 1 ? ' não lido' : ' não lidos') : '');

    const visiveis = filtro === 'nao-lidos' ? contatos.filter(c => !c.lido) : contatos;
    lista.innerHTML = '';
    if (!visiveis.length) {
      lista.appendChild(contatos.length
        ? vazio('Tudo lido', 'Nenhum contato pendente de leitura.')
        : vazio('Nenhum contato ainda', 'Quando alguém preencher o formulário "Solicite uma demonstração" no site, o pedido aparece aqui.'));
      return;
    }
    visiveis.forEach(c => lista.appendChild(cartao(c)));
  }

  async function marcar(c, lido) {
    const resp = await fetch('/api/contatos/' + encodeURIComponent(c.id), {
      method: 'PATCH', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lido })
    });
    if (!resp.ok) { UHNUI.aviso('Não foi possível atualizar.', 'erro'); return; }
    c.lido = lido;
    renderizar();
  }

  async function remover(c) {
    const ok = await UHNUI.confirmar({
      titulo: 'Excluir contato',
      texto: 'O pedido de "' + c.nome + '" será apagado.\nEsta ação não pode ser desfeita.',
      confirmar: 'Excluir', perigo: true
    });
    if (!ok) return;
    const resp = await fetch('/api/contatos/' + encodeURIComponent(c.id), { method: 'DELETE', credentials: 'same-origin' });
    if (!resp.ok) { UHNUI.aviso('Não foi possível excluir.', 'erro'); return; }
    contatos = contatos.filter(x => x.id !== c.id);
    renderizar();
    UHNUI.aviso('Contato excluído.', 'sucesso');
  }

  document.querySelectorAll('.filtro').forEach(b => b.addEventListener('click', () => {
    filtro = b.dataset.filtro;
    document.querySelectorAll('.filtro').forEach(x => {
      x.classList.toggle('ativo', x === b);
      x.setAttribute('aria-selected', String(x === b));
    });
    renderizar();
  }));

  async function iniciar() {
    const usuario = await UHNUI.montarBarraLateral('contatos');
    if (!usuario) return;
    if (usuario.papel !== 'admin') {
      document.querySelector('.conteudo').innerHTML = '';
      document.querySelector('.conteudo').appendChild(vazio('Acesso restrito', 'Apenas administradores veem os contatos.'));
      return;
    }
    try {
      const resp = await fetch('/api/contatos', { credentials: 'same-origin' });
      if (!resp.ok) throw new Error();
      contatos = (await resp.json()).contatos;
      renderizar();
    } catch {
      lista.innerHTML = '';
      lista.appendChild(vazio('Erro ao carregar', 'Verifique se o servidor está no ar.'));
    }
  }

  iniciar();
})();
</script>
</body>
</html>
