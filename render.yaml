# Deploy no Render (https://render.com)
#
# Planilhas ficam no Cloudflare R2 (lib/r2.js), não no disco do Render — por
# isso sobrevivem a deploys e reinícios de graça, mesmo no plano free. Configure
# as 4 variáveis R2_* abaixo com "sync: false" no painel do serviço
# (Environment), usando os mesmos valores do seu .env local. Nunca commitar
# esses valores aqui.
#
# O disco do Render em si continua efêmero no plano gratuito: o que sobra fora
# do R2 (novos painéis criados pela tela, sessões) some a cada deploy/reinício
# e volta ao que está commitado em data/database.json. Para isso também
# persistir, é preciso um plano pago com Persistent Disk montado em data/
# (descomentar o bloco "disk:" abaixo) — não é necessário só para as planilhas.
services:
  - type: web
    name: epcview
    runtime: node
    plan: free
    buildCommand: "echo sem dependencias a instalar"
    startCommand: "node server.js"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
    # disk:
    #   name: epcview-dados
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
